name: Firmware
# Builds the FM-1 packages on GitHub's Linux x86-64 runners, where JieLi's toolchain runs natively (no Docker).
# The .fwsc files and the build logs (flash, RAM and pool headroom) are attached to each run as artifacts.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python packages
        run: python3 -m pip install --user pillow
      # restore and save apart: the cache is kept once the download worked, even when the build then fails
      - name: Restore the JieLi toolchain and SDK
        id: jieli
        uses: actions/cache/restore@v4
        with:
          path: ~/.jieli
          key: jieli-${{ hashFiles('base/tools/get_toolchain.sh', 'base/bsp/tools/get_sdk.sh') }}
      - name: Toolchain and SDK
        env:
          # JieLi's GitHub copy of the SDK is gone (404 since Nov 2026); their Gitee repository has the pinned
          # revision, and get_sdk.sh checks the files' SHA-256 either way.
          SDK_URL: https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK
        run: |
          # JieLi's server sometimes resets the connection mid-download: up to three tries, from scratch each
          for i in 1 2 3; do
            [ -e ~/.jieli/toolchain ] && break
            rm -rf ~/.jieli/jieli-linux-toolchains-*
            sh base/tools/get_toolchain.sh || sleep 10
          done
          [ -e ~/.jieli/toolchain ]
          [ -d ~/.jieli/ac79-sdk/.git ] || sh base/bsp/tools/get_sdk.sh
      - name: Save the JieLi toolchain and SDK
        if: steps.jieli.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.jieli
          key: ${{ steps.jieli.outputs.cache-primary-key }}
      - name: Build all packages
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          AC79_SDK: /home/runner/.jieli/ac79-sdk
        run: |
          mkdir -p logs
          status=0
          build() {  # NAME APP_DIR [ARGS...]
            n=$1; shift
            if python3 base/tools/build.py "$@" > "logs/$n.log" 2>&1; then r=ok; else r=FAILED; status=1; fi
            {
              echo "### $n: $r"
              echo '```'
              grep -iE "flash|sram|ram |ram:|pool|headroom|slot|overflow|error|\.fwsc" "logs/$n.log" | tail -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          build full app
          cp app/build/run4ctl.dis app/build/run4ctl-full.dis 2>/dev/null || true   # (the USB-only build writes it again)
          build usb-only app --no-ble
          build no-amb app-noamb
          build stems app-stems
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ github.sha }}
          path: |
            app*/build/*.fwsc
            app*/build/firmware*.json
            app*/build/*.dis
            logs/
          if-no-files-found: warn
