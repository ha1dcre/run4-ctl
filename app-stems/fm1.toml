# RUN4 CTL STEMS build settings (base/tools/build.py app-stems): app/fm1.toml with six USB audio input channels
# (usb_audio_channels = 6: 1-2 the mix, 3-4 the dry voices, 5-6 the effects' return). Keep the rest in step with app/.
name = "RUN4CTL-STEMS"
id_prefix = "FM-1_74"            # package identity (own prefix, not fm1-base's template)
usb_manufacturer = "RUN4 CTL"
usb_product = "RUN4 CTL FM-1 STEMS"
include = ["../src"]             # the shared protocol codec (src/r4p.[ch]) and the UI
words = "../app/words.tsv"
font_full = ["M"]                # lower case in the value font: the host formats the text (dB, ms, x)
# Bluetooth MIDI (build.py --no-ble builds the USB-only NAME-usb.fwsc). The own stack (bt/, docs/bt/BLE-STACK.md in fm1-base) is
# used because its BLE-MIDI handles SysEx both ways ("SysEx over packets" in and out), which RUN4 CTL's protocol rides on;
# JieLi's library stack is not documented to. No pairing: macOS and iOS connect without it.
ble = true
ble_stack = "own"
cpu2 = true                      # the second core: DUB's and AMB's plate reverb on it (app.c c2_*, plate.h's pipe), trusted
cpu2_fallback = true             # only after a test under load; a unit that misreads on it runs one core, never a restart
usb_audio_in = true              # the FM-1's output recordable over USB (RUN4 records Synth mode); fm1-base's default, stated
usb_audio_out = false            # no USB audio output: an iPad keeps its own speaker / headphones for RUN4 (with one, iOS
                                 # sends all its sound to the FM-1 and greys the app's output choice); firmware 0.9.1
usb_audio_channels = 6           # the stems: 3-4 dry, 5-6 effects (44.1 kHz only, as the stereo build is)
backup = true                    # a USB backup / restore of everything stored but the panel (app.h APP_BACKUP_*)
mirror = true                    # the screen and panel mirrored over USB (fm1-base web/mirror, tools/fm1_mirror.py)
midi_stamp = true                # MIDI in stamped where it lands: notes and clock placed in the block (app.c midi_pump)
o2 = ["../src/plate.c", "../src/amb/amb.c", "../src/dub/dub.c"]   # the plate reverb (every mode), AMB's and DUB's engines: own units at -O2 (float DSP)
emu = ["midi"]                   # browser emulator (build.py app --web): Web MIDI in/out with SysEx (keyboard, RUN4)

# firmware.json and the release check (base/docs/FIRMWARE-JSON.md; `build.py app --release X.Y` refuses without these)
author = "Eugen Schott"
licence = "GPL-3.0-only"
tagline = "RUN4 controller and FM synth, USB stems"
description = "Four modes. RUN4 mode makes the M-VAVE FM-1 a hardware controller for the iOS app RUN4 over USB or Bluetooth MIDI: the app draws its pages and lights and can play its FM engine. Synth mode is a six-operator FM synth with effects, arpeggiator, morph, MIDI learn and a step sequencer. AMB mode is AMB-1's generative ambient garden: pads, bells on tape loops, bass, pulse, tape echo, plate. DUB mode is DUB-1's generative dub techno: chord stabs into a tape echo, pings, sub bass, a ducking kick; Filter, Dub, Energy, Space, dub hold, effects grid. Hold a button for help. Everything backs up over USB."
tags = ["controller", "synth", "fm", "sequencer", "midi", "ambient", "generative"]
install = "https://todo-owner.example/run4-ctl/install/"   # TODO-OWNER: where the web installer will be published
repo = "https://todo-owner.example/run4-ctl"              # TODO-OWNER: the public source repository
site = "https://todo-owner.example/run4-ctl/"             # TODO-OWNER: the project site
screenshot = "docs/img/screen.png"
credits = "Built on fm1-base and felucca-bsp (MPL-2.0). AMB mode: AMB-1 by Charles Vestal (MPL-2.0). DUB mode: DUB-1 by Santiago Begueria (GPL-3.0-only). Not affiliated with M-VAVE."
